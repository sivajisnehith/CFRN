# ============================================================================
# CFRN - Default configuration
# Counterfactual Failure-Propagation Debt Optimization
# ============================================================================

seed: 42

# ----------------------------------------------------------------------------
# Data sources. If a real dataset path is given and exists, it is used.
# Otherwise a synthetic generator that mimics the dataset schema is used so
# the whole pipeline runs end-to-end reproducibly.
# ----------------------------------------------------------------------------
data:
  caida:
    # Path to a CAIDA ITDK nodes/links file (e.g. *.nodes / *.links). Optional.
    nodes_file: null
    links_file: null
    # Synthetic fallback graph size.
    synthetic:
      n_nodes: 120
      attach_m: 2          # Barabasi-Albert attachment (scale-free, Internet-like)
  cesnet:
    # Path to a CESNET-TimeSeries24 CSV/parquet of traffic time series. Optional.
    traffic_file: null
    synthetic:
      n_series: 240
      n_timesteps: 672     # one week at 15-min resolution
      resolution_minutes: 15

# ----------------------------------------------------------------------------
# Network / capacity model
# ----------------------------------------------------------------------------
network:
  # Each link capacity is drawn relative to the sum of adjacent node loads.
  capacity_headroom: 0.95  # capacity = headroom * p75(load) network reference
  overload_threshold: 1.0  # utilisation > threshold => link overloaded

# ----------------------------------------------------------------------------
# Failure injection
# ----------------------------------------------------------------------------
failure:
  type: link            # one of: link, node
  target: null          # explicit target id, or null to pick by strategy
  strategy: betweenness # highest-betweenness element when target is null

# ----------------------------------------------------------------------------
# Propagation model (multi-step cascade)
# ----------------------------------------------------------------------------
propagation:
  horizon: 6            # H: number of propagation steps to simulate
  gamma: 0.85           # discount factor for future-step debt
  redistribution: 0.9   # fraction of a failed link's load pushed to alternates
  overload_fail_prob: 0.6  # base prob. an overloaded link/node fails next step
  overload_beta: 0.4    # sensitivity beta to excess relative overload in p_fail(u)

# ----------------------------------------------------------------------------
# Counterfactual mutation generation
# ----------------------------------------------------------------------------
counterfactual:
  max_candidates: 24    # cap on generated candidate mutations per scenario
  enable:
    remove_link: true
    add_link: true
    reroute_flow: true
    isolate_path: true
  reroute_fractions: [0.25, 0.5, 0.75]  # discrete candidate diversion fractions
  adaptive_diversion: true              # whether to compute dynamic headroom diversion fraction

# ----------------------------------------------------------------------------
# Principled Optimization & Feasibility Constraints
# ----------------------------------------------------------------------------
optimization:
  mechanism: constrained  # one of: constrained, robust, weighted, ratio
  alpha: 1.0              # physical link change cost weight (OpEx)
  beta: 0.5               # routing / service rule update cost weight (OpEx)
  chi: 0.3                # control plane signaling / effort cost weight (OpEx)
  eta: 0.4                # adaptability scaling coefficient (spectral gap to debt)
  epsilon: 0.001          # numerical floor for ratio comparison
  # Explicit operational feasibility constraints
  budget_max: 2.5         # maximum allowable mutation cost (covers link addition + reroute)
  utilization_max: 2.0    # maximum allowable peak link utilization
  min_giant_ratio: 0.85   # minimum preserved giant component fraction
  min_algebraic_conn: 0.001 # minimum algebraic connectivity (non-partition)
  max_unserved_demand: 0.4  # maximum allowable unserved demand fraction
  # Uncertainty-aware robust optimization
  risk_aversion: 0.5      # kappa: penalty on cascade rollout standard deviation
  n_uncertainty_samples: 3 # stochastic rollout count for robust evaluation

# ----------------------------------------------------------------------------
# Learning / self-evolution
# ----------------------------------------------------------------------------
learning:
  model_path: models/cfrn_cpd_model.joblib
  min_samples_to_train: 20       # minimum training samples to activate surrogate
  retrain_interval: 10           # periodic retraining interval (epochs)
  screening_top_k: 5             # minimum top-k candidates to simulate after screening
  uncertainty_margin: 0.35       # margin tau_screen for candidate acquisition
  drift_threshold_factor: 3.0    # Page-Hinkley drift multiplier
  enable_screening: true         # active surrogate screening in closed loop

# ----------------------------------------------------------------------------
# Experiment driver
# ----------------------------------------------------------------------------
experiment:
  n_scenarios: 60
  out_dir: results
